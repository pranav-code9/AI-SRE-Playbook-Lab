[project]
name = "sre-rollout"
version = "0.1.0"
description = "Chapter 8: shadow mode, agent-assisted postmortems and impact measures"
requires-python = ">=3.11"
dependencies = ["investigator", "sre-evals", "pyyaml>=6"]   # pip install -e ../agent -e ../evals first

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sre-rollout = "sre_rollout.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../agent/src", "../evals/src", "../policies/src", "../mcp-server/src"]
