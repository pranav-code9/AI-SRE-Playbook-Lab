[project]
name = "investigator"
version = "0.1.0"
description = "Chapter 3 investigation agent for The AI SRE Playbook"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0",
  "langchain>=1.0",
  "langchain-core>=1.0",
  "pydantic>=2.7",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic"]
openai = ["langchain-openai"]
google = ["langchain-google-genai"]
neo4j = ["neo4j>=5"]
otel = ["opentelemetry-sdk>=1.30", "opentelemetry-exporter-otlp-proto-grpc>=1.30"]
dev = ["pytest>=8", "opentelemetry-sdk>=1.30"]

[project.scripts]
investigate = "investigator.cli:main"
build-topology = "investigator.topology:main"
sre-change-exporter = "investigator.change_exporter:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
