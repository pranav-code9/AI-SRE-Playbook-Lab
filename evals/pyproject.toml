[project]
name = "sre-evals"
version = "0.1.0"
description = "Chapter 6 evaluation harness for The AI SRE Playbook"
requires-python = ">=3.11"
dependencies = ["investigator", "pyyaml>=6"]   # pip install -e ../agent first

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sre-evals = "sre_evals.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../agent/src"]
