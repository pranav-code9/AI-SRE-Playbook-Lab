[project]
name = "sre-policy"
version = "0.1.0"
description = "Chapter 5 trust ladder for The AI SRE Playbook: policy, approvals, audit, kill switch"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "pyyaml>=6", "httpx>=0.27", "starlette>=0.37"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sre-policy = "sre_policy.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
