[project]
name = "sre-obs"
version = "0.1.0"
description = "Chapter 7: observing the agent itself"
requires-python = ">=3.11"
dependencies = ["investigator"]   # pip install -e ../agent first

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]

[project.scripts]
sre-obs = "sre_obs.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../agent/src"]
